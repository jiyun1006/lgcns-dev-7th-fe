<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <!-- background -->
  <rect width="800" height="560" fill="#F7A8C8"/>
  <circle cx="110" cy="90" r="60" fill="#F9BCD5"/>
  <circle cx="700" cy="470" r="90" fill="#F9BCD5"/>
  <circle cx="680" cy="110" r="18" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="140" cy="460" r="12" fill="#FFFFFF" opacity="0.6"/>

  <!-- body -->
  <ellipse cx="400" cy="600" rx="260" ry="150" fill="#1B1B1F"/>

  <!-- tail -->
  <path d="M620 520 C720 480 720 360 650 330" stroke="#1B1B1F" stroke-width="38" fill="none" stroke-linecap="round"/>

  <!-- ears -->
  <path d="M215 210 L240 60 L340 150 Z" fill="#1B1B1F"/>
  <path d="M585 210 L560 60 L460 150 Z" fill="#1B1B1F"/>
  <path d="M245 170 L255 100 L305 145 Z" fill="#E86FA0"/>
  <path d="M555 170 L545 100 L495 145 Z" fill="#E86FA0"/>

  <!-- head -->
  <ellipse cx="400" cy="300" rx="215" ry="185" fill="#1B1B1F"/>

  <!-- eyes (half-lidded, mischievous) -->
  <ellipse cx="315" cy="280" rx="48" ry="38" fill="#D8F25C"/>
  <ellipse cx="485" cy="280" rx="48" ry="38" fill="#D8F25C"/>
  <ellipse cx="325" cy="288" rx="12" ry="28" fill="#1B1B1F"/>
  <ellipse cx="495" cy="288" rx="12" ry="28" fill="#1B1B1F"/>
  <circle cx="331" cy="275" r="5" fill="#FFFFFF"/>
  <circle cx="501" cy="275" r="5" fill="#FFFFFF"/>
  <!-- eyelids -->
  <path d="M262 278 Q315 230 368 262 L368 236 L262 236 Z" fill="#1B1B1F"/>
  <path d="M432 262 Q485 230 538 278 L538 236 L432 236 Z" fill="#1B1B1F"/>
  <!-- brows -->
  <path d="M268 232 L350 250" stroke="#3A3A42" stroke-width="8" stroke-linecap="round"/>
  <path d="M532 232 L450 250" stroke="#3A3A42" stroke-width="8" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="265" cy="345" rx="26" ry="14" fill="#E86FA0" opacity="0.55"/>
  <ellipse cx="535" cy="345" rx="26" ry="14" fill="#E86FA0" opacity="0.55"/>

  <!-- nose -->
  <path d="M388 330 L412 330 L400 344 Z" fill="#F48BB5"/>

  <!-- smirk mouth with one fang -->
  <path d="M400 344 Q385 372 355 362" stroke="#F7F7F7" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M400 344 Q420 380 462 360" stroke="#F7F7F7" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M428 366 L436 390 L444 364 Z" fill="#FFFFFF"/>

  <!-- whiskers -->
  <g stroke="#4A4A55" stroke-width="5" stroke-linecap="round">
    <line x1="230" y1="345" x2="120" y2="325"/>
    <line x1="230" y1="360" x2="115" y2="365"/>
    <line x1="232" y1="375" x2="125" y2="405"/>
    <line x1="570" y1="345" x2="680" y2="325"/>
    <line x1="570" y1="360" x2="685" y2="365"/>
    <line x1="568" y1="375" x2="675" y2="405"/>
  </g>

  <!-- paws -->
  <ellipse cx="300" cy="520" rx="55" ry="32" fill="#26262C"/>
  <ellipse cx="500" cy="520" rx="55" ry="32" fill="#26262C"/>
</svg>
